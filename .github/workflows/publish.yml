name: Publish to PyPI

# Builds the sdist and wheel for a version tag and uploads them with PyPI trusted
# publishing (configure the project's trusted publisher on PyPI for this workflow).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Test
      run: |
        python -m pip install . pytest
        python -m pytest tests/
    - name: Build
      run: |
        python -m pip install --upgrade build
        python -m build
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
