name: Lint-Test-Mypy

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install and configure poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
    - name: cache deps
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: .venv
        key: pydeps-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: install_dependencies_only
      run: poetry install --no-interaction --no-root --with analysis

    - name: install_project
      run: poetry install --no-interaction --with analysis

    - name: Pylint (errors only)
      run: poetry run pylint --errors-only src/twpasolver

    - name: Mypy
      run: poetry run mypy src/

    - name: Tests with coverage
      run: poetry run pytest tests/ --cov=twpasolver --cov-report=term-missing:skip-covered
