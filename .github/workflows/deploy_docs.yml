name: Docs

# Built on every push and pull request; published to gh-pages for version tags, and
# from main when run by hand (Actions > Docs > Run workflow), e.g. for docs-only fixes.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install and configure poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
    - name: cache deps
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: .venv
        key: docs-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install
      run: poetry install --no-interaction --with docs

    - name: Build documentation
      run: |
        sudo apt-get install -y pandoc
        poetry run python -m ipykernel install --user --name twpaenv
        poetry run make -C docs html

    - name: Deploy
      if: >-
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/build/html
