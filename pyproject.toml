[project]
name = "twpasolver"
version = "0.1.0"
description = "Simulation of kinetic-inductance traveling-wave parametric amplifiers: circuit models, Bloch-mode coupled mode equations, gain and phase matching."
authors = [{ name = "twpalab" }]
maintainers = [{ name = "Pietro Campana", email = "p.campana1@campus.unimib.it" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["TWPA", "KI-TWPA", "kinetic inductance", "parametric amplifier", "coupled mode equations", "superconducting circuits", "Bloch modes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26",
  "numba>=0.59.0",
  "pydantic>=2.6.3",
  "scikit-rf>=0.32.0",
  "scipy>=1.12.0",
  "h5py>=3.10,<4",
  "matplotlib>=3.7",
  "networkx>=3.0",
  "typing-extensions>=4.6",
]

[project.urls]
repository = "https://github.com/twpalab/twpasolver"
documentation = "https://twpalab.github.io/twpasolver/"

[project.scripts]
twpasolver-warmup = "twpasolver.cmes.warmup:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.analysis]
optional = true

[tool.poetry.group.analysis.dependencies]
pylint = ">=2.16.0"
pylint-exit = "^1.2.0"
pytest = ">=7.2.2"
pytest-cov = ">=4.1.0"
mypy = "^1.7.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^6.1.3"
nbsphinx = "^0.9.4"
furo = "^2023.3.27"
recommonmark = "^0.7.1"
sphinx-copybutton = "^0.5.1"
sphinx-last-updated-by-git = "^0.3.5"
autodoc_pydantic = ">=2.1.0"
ipykernel = ">=6.15.2"
ipython = ">=8.4.0"

[[tool.mypy.overrides]]
module=["numba.*", "h5py.*", "skrf", "scipy.*", "matplotlib.*", "networkx.*"]
ignore_missing_imports = true

[tool.pycln]
all = true

[tool.pylint.basic]
# Physics symbols: circuit elements, currents, matrices and Greek-letter names.
good-names-rgxs = ["^[A-Z][A-Za-z0-9_]{0,15}$", "^[a-z][a-z0-9]?(_[A-Za-z0-9]+)*$"]

[tool.pylint.typecheck]
# Pydantic fields with Field(default=...) are inferred as FieldInfo, not their value.
ignored-classes = ["FieldInfo"]

[tool.pylint.format]
max-line-length = 100

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"
